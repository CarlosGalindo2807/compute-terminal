name: CI

# Runs on every PR and on every push to main. The branch-protection rules
# in GitHub require both jobs below to be green before a PR can be merged.
# This is the gate that makes the methodology lock test (and the rest of
# the suite) load-bearing — without CI, the lock test only catches drift
# locally, not in PRs the Index Architect agent opens.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref. Saves Actions minutes when the
# Index Architect agent force-pushes to its feature branch mid-research.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all workspaces
        run: pnpm -r typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests (workers package)
        # The methodology lock test lives here. If this fails, the PR
        # is bypassing the published methodology contract — refuse to merge.
        working-directory: apps/workers
        run: |
          node --test --import tsx \
            'src/lib/url-safety.test.ts' \
            'src/functions/scrapers.test.ts' \
            'src/functions/methodology.test.ts'
