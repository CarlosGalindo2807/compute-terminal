[project]
name = "compute-terminal-scrapers"
version = "0.0.1"
description = "Compute Index Terminal — provider scrapers"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "httpx>=0.27.2",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "supabase>=2.10.0",
    "playwright>=1.49.0",
    "python-dotenv>=1.0.1",
    "truststore>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.1",
    "ruff>=0.8.4",
    "mypy>=1.13.0",
]

[project.scripts]
ct-scrape = "core.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "providers*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["providers", "core"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
